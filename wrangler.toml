# zeidexsoft.com — Cloudflare Worker with static assets (primary host).
# Deploy: npm run deploy:cf  (drops dist/_redirects: Netlify-only; SPA fallback is not_found_handling)
name = "zeidex"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
# Worker first, so www → apex redirects cover asset paths too.
assets = { directory = "dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = true }
routes = [
  { pattern = "zeidexsoft.com", custom_domain = true },
  { pattern = "www.zeidexsoft.com", custom_domain = true },
]
workers_dev = false

[[kv_namespaces]]
binding = "DOWNLOADS"
id = "a547128ea8f647fb9e553bcd1b0f056e"

# Atomic per-location burst limits (KV counters are eventually consistent).
[[ratelimits]]
name = "PAY_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "ORDER_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "BOT_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[vars]
# BOT_TOKEN is expected to be provided via environment variables / secrets
# e.g., wrangler secret put BOT_TOKEN
