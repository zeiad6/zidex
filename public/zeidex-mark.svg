<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Tech Canvas Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a"/>
      <stop offset="50%" stop-color="#0e1326"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>

    <!-- Outer Precision Rim -->
    <linearGradient id="borderRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#00e676" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonZTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="neonZDiagonal" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="neonZBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <!-- Atmospheric Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#00e676" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Container Squircle with Precision Border -->
  <rect x="14" y="14" width="484" height="484" rx="116" fill="url(#canvasGrad)" stroke="url(#borderRim)" stroke-width="4" filter="url(#subtleShadow)"/>

  <!-- Radial Core Light -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)"/>

  <!-- Inner Cyber Grid Accent (Subtle) -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <circle cx="256" cy="256" r="160" fill="none"/>
  </g>

  <!-- Master Monogram 'Z' -->
  <g filter="url(#softGlow)">
    <!-- Top Horizontal Wing -->
    <path d="M 120 128 L 368 128 C 385 128 395 147 384 161 L 340 216 C 335 222 327 226 319 226 L 168 226 C 146 226 138 202 153 186 L 180 156 C 185 150 192 146 200 146 L 336 146 L 350 128 Z" fill="none"/>
    
    <!-- Ultra Bold Faceted 'Z' Shape -->
    <!-- Wing 1: Top Bar with Cyber Bevel -->
    <path d="M 116 134 C 116 122.95 124.95 114 136 114 L 372 114 C 387.5 114 396.5 131.5 387 143.8 L 334 212 C 328.5 219 320 223 311 223 L 140 223 C 126.7 223 116 212.3 116 199 Z" fill="url(#neonZTop)"/>

    <!-- Wing 2: Dynamic Diagonal Thrust -->
    <path d="M 384 140 L 184 394 C 176 404 161 398 161 386 L 161 346 C 161 336 166 327 174 321 L 342 108 C 352 95 373 103 373 119 L 373 135 C 373 137 384 140 384 140 Z" fill="none"/>

    <!-- Diagonal Power Slash -->
    <polygon points="380,126 396,146 172,398 132,398 116,378 340,126" fill="url(#neonZDiagonal)"/>

    <!-- Wing 3: Bottom Bar with Cyber Bevel -->
    <path d="M 396 378 C 396 389.05 387.05 398 376 398 L 140 398 C 124.5 398 115.5 380.5 125 368.2 L 178 300 C 183.5 293 192 289 201 289 L 372 289 C 385.3 289 396 299.7 396 313 Z" fill="url(#neonZBottom)"/>

    <!-- Floating Energy Core Accent (Pulsing Diamond & Dot) -->
    <g transform="translate(256, 256)">
      <circle cx="0" cy="0" r="24" fill="#00f2fe" opacity="0.2"/>
      <circle cx="0" cy="0" r="11" fill="#ffffff" opacity="0.95"/>
      <path d="M -18 0 L 0 -18 L 18 0 L 0 18 Z" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8"/>
    </g>
  </g>
</svg>