<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6D5CFF"/>
      <stop offset="100%" style="stop-color:#00C9A7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9187FF"/>
      <stop offset="100%" style="stop-color:#55D9C0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0B0D1E"/>
  <rect width="512" height="512" rx="112" fill="url(#g1)" opacity="0.15"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#g1)" stroke-width="4" opacity="0.3"/>

  <!-- Search magnifier body -->
  <circle cx="236" cy="226" r="88" fill="url(#g2)" opacity="0.9"/>
  <circle cx="236" cy="226" r="88" fill="url(#g1)" opacity="0.4"/>

  <!-- Inner highlight -->
  <circle cx="236" cy="226" r="72" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>

  <!-- Search lens center -->
  <circle cx="236" cy="226" r="56" fill="#0B0D1E" opacity="0.35"/>

  <!-- Magnifier handle -->
  <line x1="296" y1="286" x2="340" y2="330" stroke="url(#g2)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Telegram-style send arrow inside lens -->
  <g transform="translate(206, 196) scale(1.2)">
    <path d="M0 24 L60 4 L20 44 L16 64 Z" fill="white" opacity="0.95"/>
    <path d="M60 4 L16 36 L20 44 Z" fill="url(#g1)"/>
  </g>

  <!-- Floating dots -->
  <circle cx="180" cy="340" r="8" fill="#6D5CFF" opacity="0.6"/>
  <circle cx="330" cy="150" r="6" fill="#00C9A7" opacity="0.7"/>
  <circle cx="360" cy="320" r="5" fill="#9187FF" opacity="0.5"/>

  <!-- Bottom accent bar -->
  <rect x="156" y="420" width="200" height="8" rx="4" fill="url(#g1)" opacity="0.8"/>

  <!-- Text: Z for Zeidex -->
  <text x="256" y="470" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="36" font-weight="800" fill="white" text-anchor="middle" opacity="0.9" letter-spacing="4">Z</text>
</svg>
