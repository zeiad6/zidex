  </text>

  <!-- Tag Pills -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="170" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="85" y="30" font-family="'IBM Plex Sans Arabic', system-ui, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle">Telegram Bots</text>

    <rect x="185" y="0" width="150" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="260" y="30" font-family="'IBM Plex Sans Arabic', system-ui, sans-serif" font-size="18" font-weight="700" fill="#00e676" text-anchor="middle">ZeidexLink</text>

    <rect x="350" y="0" width="160" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="430" y="30" font-family="'IBM Plex Sans Arabic', system-ui, sans-serif" font-size="18" font-weight="700" fill="#c084fc" text-anchor="middle">Digital Stores</text>
  </g>

  <text x="100" y="580" font-family="monospace" font-size="20" font-weight="700" fill="#00f2fe">
