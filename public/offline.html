<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f4fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d1e" media="(prefers-color-scheme: dark)">
  <title>أنت غير متصل — ZeidexSoft</title>
  <!--
    Fully self-contained: no font, image or script request leaves the device —
    offline must not depend on the network it explains is missing.
  -->
  <style>
    :root { color-scheme: light dark }
    * { margin: 0; padding: 0; box-sizing: border-box }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: #f3f4fa;
      color: #1c2033;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0d1e; color: #e7e9f4 }
    }
    main { max-width: 26rem }
    .badge {
      width: 84px; height: 84px;
      margin: 0 auto 22px;
      display: grid; place-items: center;
      font-size: 40px;
      border-radius: 26px;
      background: rgba(109, 92, 255, 0.12);
    }
    h1 { font-size: 22px; font-weight: 800; line-height: 1.4 }
    p { margin-top: 10px; font-size: 14px; line-height: 1.9; opacity: 0.75 }
    .en { font-size: 12.5px; opacity: 0.55 }
    button {
      margin-top: 26px;
      padding: 13px 30px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #6d5cff;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
    }
    button:hover { background: #5a49e6 }
    :dir(ltr) main { direction: ltr }
  </style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>هذه الصفحة محفوظة على جهازك. الصفحات التي زرتها سابقًا تعمل دون اتصال — وعند عودة الشبكة يُعاد التحميل تلقائيًا.</p>
    <p class="en" dir="ltr">You're offline. Previously visited pages keep working — this reloads itself once the connection returns.</p>
    <button onclick="location.reload()">↻ إعادة المحاولة</button>
  </main>
  <!-- Back online: reload straight into the live site — offline here is a state, not a page. -->
  <script>
    addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
