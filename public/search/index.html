        let currentType = 'all';
        let currentCategory = 'all';

        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const typeFilters = document.getElementById('typeFilters');
        const categoryFilters = document.getElementById('categoryFilters');
        const totalItemsEl = document.getElementById('totalItems');
        const totalMembersEl = document.getElementById('totalMembers');

        function normalizeArabic(text) {
            if (!text) return '';
            return text
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/[ًٌٍَُِّْٰ]/g, '')
                .replace(/[ىي]/g, 'ي')
                .replace(/[ؤ]/g, 'و')
                .replace(/[ئ]/g, 'ي')
                .toLowerCase()
                .trim();
        }

        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function renderResults() {
            const query = normalizeArabic(searchInput.value);

            const filtered = allEntities.filter(it => {
                const matchesType = currentType === 'all' || it.type === currentType;
                const matchesCat = currentCategory === 'all' || it.category === currentCategory;

                let matchesQuery = true;
                if (query) {
                    const normTitle = normalizeArabic(it.title);
                    const normDesc = normalizeArabic(it.description);
                    const normUname = it.username.toLowerCase();
                    const normCat = normalizeArabic(it.category);
                    matchesQuery = normTitle.includes(query) ||
                                   normDesc.includes(query) ||
                                   normUname.includes(query) ||
                                   normCat.includes(query);
                }
                return matchesType && matchesCat && matchesQuery;
            });

            // Sort by verified and members
            filtered.sort((a, b) => b.members - a.members);

            if (filtered.length === 0) {
                resultsList.innerHTML = '<div class="empty-state"><div class="emoji">😔</div><h3>لا توجد نتائج مطابقة</h3><p>جرب كلمات أخرى أو غيّر خيارات الفلترة</p></div>';
                return;
            }

            resultsList.innerHTML = filtered.map(it => {
                let typeBadge = '';
                let memberLabel = '';
                if (it.type === 'bot') {
                    typeBadge = '<span class="badge-type badge-bot">🤖 بوت</span>';
                    memberLabel = '⚡ متاح للاستخدام الفوري';
                } else if (it.type === 'group') {
                    typeBadge = '<span class="badge-type badge-group">👥 مجموعة</span>';
                    memberLabel = formatNumber(it.members) + ' عضو';
                } else {
                    typeBadge = '<span class="badge-type badge-channel">📢 قناة</span>';
                    memberLabel = formatNumber(it.members) + ' مشترك';
                }

                const verifiedBadge = it.verified ? ' ✅' : '';
                const desc = it.description ? it.description : 'حساب تيليجرام نشط ومفحوص';
                const emoji = it.emoji || '📢';

                return '<div class="channel-card">' +
                    '<div class="channel-header">' +
                        '<div class="channel-emoji">' + emoji + '</div>' +
                        '<div class="channel-info">' +
                            '<div class="channel-title">' + it.title + verifiedBadge + ' ' + typeBadge + '</div>' +
                            '<div class="channel-meta"><span class="active-dot">● نشط وشغال</span> · ' + it.category + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="channel-desc">' + desc + '</div>' +
                    '<div class="channel-footer">' +
                        '<div class="channel-stats">👥 ' + memberLabel + '</div>' +
                        '<a href="https://t.me/' + it.username + '" target="_blank" class="channel-link">فتح @' + it.username + '</a>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function updateStats() {
            totalItemsEl.textContent = allEntities.length;
            const sumMembers = allEntities.reduce((acc, curr) => acc + (curr.members || 0), 0);
            totalMembersEl.textContent = formatNumber(sumMembers);
        }

        // Event listeners
        searchInput.addEventListener('input', renderResults);

        typeFilters.addEventListener('click', (e) => {
            const btn = e.target.closest('.type-btn');
            if (!btn) return;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentType = btn.dataset.type;
            renderResults();
        });

        categoryFilters.addEventListener('click', (e) => {
            const chip = e.target.closest('.cat-chip');
            if (!chip) return;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentCategory = chip.dataset.cat;
            renderResults();
        });

        // Initialize URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const qParam = urlParams.get('q');
        const typeParam = urlParams.get('type');

        if (qParam) {
            searchInput.value = qParam;
        }
        if (typeParam && ['channel', 'bot', 'group'].includes(typeParam)) {
            currentType = typeParam;
            document.querySelectorAll('.type-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.type === typeParam);
            });
        }

        updateStats();
        renderResults();
    </script>
