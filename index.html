    <!--
      `strict-origin-when-cross-origin` is repeated as a meta fallback: the
      header in netlify.toml is authoritative, but this covers the case where
      the site is served from a host that drops custom headers.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Only the weights actually used, and `display=swap` so text paints in the
      fallback immediately instead of waiting on a third-party request.
      Nine faces in total: the UI sans, the mono, and one bold serif per
      script (Source Serif 4 / Noto Naskh Arabic) for display headings. Loaded as a normal stylesheet rather than
      the media="print"/onload swap, because an inline onload handler would be
      blocked by the site's own `script-src 'self'` CSP.
    -->
    <!--
      Three families, each with a job, each with the weights the site uses.

      display  — IBM Plex Sans Arabic. Chosen over Alexandria for headings
                because Plex Arabic has a real 700 and 800 with proper Arabic
                letterforms; Alexandria's heavier cuts are geometric and read
                poorly at heading sizes in Arabic.
      sans     — IBM Plex Sans Arabic at 400/500. Body copy lives at text-sm
                and below, where a humanist face with a tall x-height holds
                up far better than a geometric one.
      mono     — JetBrains Mono for code, at 400/600 only.

      Every weight requested here is actually used, so no request is wasted —
      and the count is well under the budget the site criticises in its own
      performance article.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"

    <script>
      // Runs before paint so the correct theme is painted with zero flash.
      (function () {
        try {
          // Light is the default. The OS preference is deliberately not
          // consulted: the site presents light-first, and only an explicit
          // visitor choice (persisted here) switches it to dark. This also
          // keeps the pre-paint decision identical to ThemeProvider's.
          var theme = localStorage.getItem('ghost-theme') === 'dark' ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
          // Language: Arabic unless the visitor picked English. Applied here
          // too so an English visitor never sees one RTL frame first.
          if (localStorage.getItem('ghost-lang') === 'en') {
            document.documentElement.lang = 'en'
            document.documentElement.dir = 'ltr'
          }
        } catch (e) {
          // Storage blocked: fall through to the light default already on <html>.
        }
      })()
    </script>
